<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1300" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif">
  <desc>卡牌战斗 × 公会运营 设计蓝图：核心循环、双回合结构与女主三线</desc>
  <rect width="1400" height="1300" fill="#16181d"/>

  <defs>
    <marker id="m-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8494"/>
    </marker>
    <marker id="m-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0564f"/>
    </marker>
    <marker id="m-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b8def"/>
    </marker>
    <marker id="m-pink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08bb0"/>
    </marker>
    <marker id="m-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d8b64f"/>
    </marker>
  </defs>

  <text x="700" y="42" text-anchor="middle" font-size="28" font-weight="600" fill="#f2f4f8">卡牌战斗 × 公会运营 — 设计蓝图</text>

  <!-- 边 -->
  <g fill="none" stroke-width="2">
    <path d="M600,105 L600,158" stroke="#7b8494" marker-end="url(#m-gray)"/>
    <path d="M600,220 L600,253" stroke="#7b8494" marker-end="url(#m-gray)"/>
    <path d="M515,348 L515,405 L180,405 L180,443" stroke="#7b8494" marker-end="url(#m-gray)"/>
    <path d="M600,385 L600,443" stroke="#e0564f" marker-end="url(#m-red)"/>
    <path d="M685,348 L685,405 L1080,405 L1080,443" stroke="#7b8494" marker-end="url(#m-gray)"/>
    <path d="M600,515 L600,583" stroke="#e0564f" marker-end="url(#m-red)"/>
    <path d="M600,655 L600,733" stroke="#e0564f" marker-end="url(#m-red)"/>
    <path d="M440,770 L330,770" stroke="#5b8def" marker-end="url(#m-blue)"/>
    <path d="M760,770 L970,650" stroke="#e08bb0" marker-end="url(#m-pink)"/>
    <path d="M1080,515 L1080,613" stroke="#e08bb0" marker-end="url(#m-pink)"/>
    <path d="M1080,685 L1080,773" stroke="#e08bb0" marker-end="url(#m-pink)"/>
    <path d="M970,650 Q850,800 930,940" stroke="#e08bb0" marker-end="url(#m-pink)"/>
    <path d="M1190,650 Q1300,850 1230,1070" stroke="#e08bb0" marker-end="url(#m-pink)"/>
    <path d="M930,810 Q765,680 740,480" stroke="#e08bb0" marker-end="url(#m-pink)"/>
    <path d="M930,940 Q300,720 320,480" stroke="#5b8def" marker-end="url(#m-blue)"/>
    <path d="M330,900 Q300,720 470,515" stroke="#5b8def" marker-end="url(#m-blue)"/>
    <path d="M600,995 L600,1068" stroke="#d8b64f" marker-end="url(#m-gold)"/>
    <path d="M1080,1105 L1080,1168" stroke="#d8b64f" marker-end="url(#m-gold)"/>
  </g>

  <!-- 边标签 -->
  <g font-size="14" fill="#aab2c0" text-anchor="middle" paint-order="stroke" stroke="#16181d" stroke-width="4">
    <text x="330" y="395">经营</text>
    <text x="880" y="395">剧情</text>
    <text x="386" y="760">运营卡</text>
    <text x="855" y="748">好感</text>
    <text x="790" y="640">女主卡 / 被动</text>
    <text x="410" y="748">生产加成</text>
    <text x="500" y="700">更强牌组</text>
    <text x="615" y="1045">是</text>
  </g>

  <!-- 节点 -->
  <g stroke-width="2">
    <!-- 城镇回合 -->
    <rect x="490" y="55" width="220" height="50" rx="10" fill="#20242c" stroke="#c8cfda"/>
    <text x="600" y="86" text-anchor="middle" font-size="18" fill="#f2f4f8">城镇回合开始</text>

    <rect x="450" y="160" width="300" height="60" rx="10" fill="#20242c" stroke="#c8cfda"/>
    <text x="600" y="192" text-anchor="middle" font-size="18" fill="#f2f4f8">生产阶段</text>
    <text x="600" y="210" text-anchor="middle" font-size="14" fill="#aab2c0">按生产值发放资源</text>

    <polygon points="450,320 600,255 750,320 600,385" fill="#20242c" stroke="#d8b64f"/>
    <text x="600" y="312" text-anchor="middle" font-size="18" fill="#f2f4f8">行动阶段</text>
    <text x="600" y="333" text-anchor="middle" font-size="14" fill="#aab2c0">选择一个行动</text>

    <!-- 运营 -->
    <rect x="40" y="445" width="280" height="70" rx="10" fill="#20242c" stroke="#5b8def"/>
    <text x="180" y="478" text-anchor="middle" font-size="18" fill="#f2f4f8">城镇经营</text>
    <text x="180" y="498" text-anchor="middle" font-size="14" fill="#aab2c0">打出运营卡 · 购买强化战斗卡</text>

    <rect x="30" y="735" width="300" height="70" rx="10" fill="#20242c" stroke="#5b8def"/>
    <text x="180" y="768" text-anchor="middle" font-size="18" fill="#f2f4f8">运营卡每回合</text>
    <text x="180" y="788" text-anchor="middle" font-size="14" fill="#aab2c0">生产资源</text>

    <rect x="30" y="865" width="300" height="70" rx="10" fill="#20242c" stroke="#5b8def"/>
    <text x="180" y="898" text-anchor="middle" font-size="18" fill="#f2f4f8">资源强化</text>
    <text x="180" y="918" text-anchor="middle" font-size="14" fill="#aab2c0">战斗牌组</text>

    <!-- 战斗 -->
    <rect x="460" y="445" width="280" height="70" rx="10" fill="#20242c" stroke="#e0564f"/>
    <text x="600" y="478" text-anchor="middle" font-size="18" fill="#f2f4f8">野外战斗</text>
    <text x="600" y="498" text-anchor="middle" font-size="14" fill="#aab2c0">进入战斗小回合</text>

    <rect x="440" y="585" width="320" height="70" rx="10" fill="#20242c" stroke="#e0564f"/>
    <text x="600" y="618" text-anchor="middle" font-size="18" fill="#f2f4f8">战斗小回合</text>
    <text x="600" y="638" text-anchor="middle" font-size="14" fill="#aab2c0">抽牌 → 打牌 → 结束回合 · 直到胜利或失败</text>

    <rect x="440" y="735" width="320" height="70" rx="10" fill="#20242c" stroke="#e0564f"/>
    <text x="600" y="768" text-anchor="middle" font-size="18" fill="#f2f4f8">胜利掉落</text>
    <text x="600" y="788" text-anchor="middle" font-size="14" fill="#aab2c0">运营卡 + 资源 + 好感</text>

    <polygon points="450,930 600,865 750,930 600,995" fill="#20242c" stroke="#d8b64f"/>
    <text x="600" y="938" text-anchor="middle" font-size="18" fill="#f2f4f8">击败最终 BOSS?</text>

    <rect x="460" y="1070" width="280" height="60" rx="10" fill="#20242c" stroke="#d8b64f"/>
    <text x="600" y="1106" text-anchor="middle" font-size="18" fill="#f2f4f8">主线通关</text>

    <!-- 女主 -->
    <rect x="950" y="445" width="260" height="70" rx="10" fill="#20242c" stroke="#e08bb0"/>
    <text x="1080" y="478" text-anchor="middle" font-size="18" fill="#f2f4f8">剧情事件</text>
    <text x="1080" y="498" text-anchor="middle" font-size="14" fill="#aab2c0">女主好感事件</text>

    <rect x="970" y="615" width="220" height="70" rx="10" fill="#20242c" stroke="#e08bb0"/>
    <text x="1080" y="648" text-anchor="middle" font-size="18" fill="#f2f4f8">好感度提升</text>
    <text x="1080" y="668" text-anchor="middle" font-size="14" fill="#aab2c0">三线接入</text>

    <rect x="930" y="775" width="300" height="70" rx="10" fill="#20242c" stroke="#e08bb0"/>
    <text x="1080" y="808" text-anchor="middle" font-size="18" fill="#f2f4f8">战斗线</text>
    <text x="1080" y="828" text-anchor="middle" font-size="14" fill="#aab2c0">女主卡 · 被动进入牌组</text>

    <rect x="930" y="905" width="300" height="70" rx="10" fill="#20242c" stroke="#e08bb0"/>
    <text x="1080" y="938" text-anchor="middle" font-size="18" fill="#f2f4f8">运营线</text>
    <text x="1080" y="958" text-anchor="middle" font-size="14" fill="#aab2c0">生产加成 · 专属运营卡</text>

    <rect x="930" y="1035" width="300" height="70" rx="10" fill="#20242c" stroke="#e08bb0"/>
    <text x="1080" y="1068" text-anchor="middle" font-size="18" fill="#f2f4f8">剧情线</text>
    <text x="1080" y="1088" text-anchor="middle" font-size="14" fill="#aab2c0">好感里程碑事件</text>

    <rect x="930" y="1170" width="300" height="60" rx="10" fill="#20242c" stroke="#d8b64f"/>
    <text x="1080" y="1206" text-anchor="middle" font-size="18" fill="#f2f4f8">女主真结局 · 主线 + 好感双达标</text>
  </g>

  <!-- 图例 -->
  <g font-size="15" fill="#aab2c0">
    <rect x="60" y="1260" width="18" height="18" rx="4" fill="#20242c" stroke="#e0564f"/>
    <text x="86" y="1274">战斗</text>
    <rect x="200" y="1260" width="18" height="18" rx="4" fill="#20242c" stroke="#5b8def"/>
    <text x="226" y="1274">运营</text>
    <rect x="340" y="1260" width="18" height="18" rx="4" fill="#20242c" stroke="#e08bb0"/>
    <text x="366" y="1274">女主</text>
    <rect x="480" y="1260" width="18" height="18" rx="4" fill="#20242c" stroke="#d8b64f"/>
    <text x="506" y="1274">结局</text>
  </g>
</svg>
